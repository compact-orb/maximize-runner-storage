name: 'Maximize Runner Storage'
description: >-
  Frees disk space on GitHub-hosted runners by removing pre-installed software
  and creating a compressed Btrfs filesystem.

inputs:
  additional-mounts:
    description: >-
      Space- or newline-separated list of extra directories to mount on the
      Btrfs filesystem.
    required: false
    default: ''
  create-filesystem:
    description: >-
      Create and mount the compressed Btrfs filesystem (default: true).
    required: false
    default: 'true'
  destination:
    description: >-
      Deprecated. Custom mount path for the Btrfs workspace (use
      additional-mounts instead).
    required: false
    default: ''
  mount-usr-local:
    description: >-
      Mount /usr/local on the Btrfs filesystem (default: true).
    required: false
    default: 'true'
  mount-workspace:
    description: >-
      Mount GITHUB_WORKSPACE on the Btrfs filesystem (default: true).
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: 'Remove pre-installed packages, tools, and data'
      shell: bash
      run: |
        purge_pkgs=$(dpkg-query --show \
          --showformat='${Priority} ${Package}\n' | \
          awk '$1 !~ /^(required|important)$/ && $2 !~ /^(linux|node|sudo)/ {
            print $2
          }')
        if [[ -n "${purge_pkgs}" ]]; then
          sudo DEBIAN_FRONTEND=noninteractive apt purge \
            --allow-remove-essential \
            --autoremove \
            --yes \
            ${purge_pkgs}
        fi

        sudo rm --force --recursive \
          /etc/apparmor.d \
          /etc/apt/sources.list.d/azure-cli.sources \
          /etc/apt/sources.list.d/google-chrome.sources \
          /etc/apt/sources.list.d/microsoft-prod.list \
          /etc/cloud \
          /etc/containers \
          /etc/default/grub.d \
          /etc/grub.d \
          /etc/mysql \
          /etc/needrestart \
          /etc/netplan \
          /etc/php \
          /etc/sgml \
          /etc/ssh \
          /etc/xml \
          /home/linuxbrew/ \
          /home/runner/.cache \
          /home/runner/.cargo \
          /home/runner/.rustup \
          /opt/az \
          /opt/google \
          /opt/hostedtoolcache \
          /opt/microsoft \
          /opt/pipx \
          /root/.* \
          /usr/lib/shim \
          /usr/lib/systemd/system-generators \
          /usr/lib/systemd/user \
          /usr/lib/systemd/user-generators \
          /usr/local/* \
          /usr/local/.* \
          /usr/share/apache-maven-* \
          /usr/share/az_* \
          /usr/share/dotnet \
          /usr/share/gradle-* \
          /usr/share/java \
          /usr/share/kotlinc \
          /usr/share/miniconda \
          /usr/share/php \
          /usr/share/swift \
          /var/lib/apt/* \
          /var/lib/command-not-found \
          /var/lib/docker \
          /var/lib/gems \
          /var/lib/libuuid \
          /var/lib/mysql \
          /var/lib/postgresql \
          /var/lib/ubuntu-release-upgrader \
          /var/lib/update-manager \
          /var/lib/update-notifier \
          /var/lib/waagent \
          /var/log/* \
          /var/www/html

        sudo userdel --remove packer || true

    - name: 'Create and mount Btrfs image'
      if: inputs.create-filesystem != 'false'
      shell: bash
      run: |
        sudo apt update
        sudo DEBIAN_FRONTEND=noninteractive apt install \
          --no-install-recommends --yes btrfs-progs

        free_bytes=$(df --block-size=1 --output=avail / | tail --lines=1)
        image_size=$(( free_bytes - 1073741824 ))

        sudo truncate --size="${image_size}" /btrfs.img
        sudo mkfs.btrfs --metadata single /btrfs.img

        sudo mkdir --parents /mnt/btrfs
        sudo mount \
          --options=loop,noatime,compress-force=zstd:3 \
          /btrfs.img /mnt/btrfs

        if [[ "${{ inputs.mount-usr-local }}" != 'false' ]]; then
          sudo mkdir --parents /mnt/btrfs/usr/local /usr/local
          sudo mount --bind /mnt/btrfs/usr/local /usr/local
          sudo mkdir --parents /usr/local/bin
        fi

        if [[ "${{ inputs.mount-workspace }}" != 'false' ]]; then
          target_dest="${{ inputs.destination }}"
          if [[ -z "${target_dest}" ]]; then
            target_dest="${GITHUB_WORKSPACE}"
          fi

          if [[ -d "${target_dest}" ]]; then
            sudo rm --force --recursive \
              "${target_dest:?}"/* 2>/dev/null || true
          else
            sudo mkdir --parents "${target_dest}"
          fi

          if [[ "${target_dest}" != "/mnt/btrfs" ]]; then
            sudo mkdir --parents /mnt/btrfs/workspace
            sudo mount --bind /mnt/btrfs/workspace "${target_dest}"
            sudo chown --recursive "$(id --user):$(id --group)" "${target_dest}"
          fi
        fi

        for dir in ${{ inputs.additional-mounts }}; do
          sudo mkdir --parents "/mnt/btrfs${dir}" "${dir}"
          sudo mount --bind "/mnt/btrfs${dir}" "${dir}"
        done
