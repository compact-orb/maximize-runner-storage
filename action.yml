name: 'Maximize Runner Storage'
description: >-
  Reclaims storage space on GitHub-hosted runners by removing non-essential
  software and adding a compressed Btrfs filesystem.

inputs:
  destination:
    description: >-
      Mount path for compressed Btrfs filesystem (defaults to
      GITHUB_WORKSPACE)
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: 'Remove non-essential packages, programs, and data'
      shell: bash
      run: |
        sudo modprobe btrfs

        sudo_pkgs=$(dpkg-query --show \
          --showformat='${db:Status-Status} ${Package}\n' | \
          grep --extended-regexp "^installed sudo" | \
          awk '{print $2}')
        if [[ -n "${sudo_pkgs}" ]]; then
          sudo apt-mark manual ${sudo_pkgs}
          sudo apt-mark hold ${sudo_pkgs}
        fi

        auto_pkgs=$(apt-mark showmanual | \
          grep --extended-regexp --invert-match "^(sudo|node)")
        if [[ -n "${auto_pkgs}" ]]; then
          sudo apt-mark auto ${auto_pkgs}
        fi

        purge_pkgs=$(dpkg-query --show \
          --showformat='${Priority} ${Package}\n' | \
          grep --extended-regexp --invert-match "required|important" | \
          awk '{print $2}' | \
          grep --extended-regexp --invert-match "^(sudo|node)")
        if [[ -n "${purge_pkgs}" ]]; then
          sudo apt purge \
            --allow-remove-essential \
            --autoremove \
            ${purge_pkgs}
        fi

        if [[ -n "${sudo_pkgs}" ]]; then
          sudo apt-mark unhold ${sudo_pkgs}
        fi

        sudo rm --recursive --force \
          /etc/apparmor.d \
          /etc/apt/sources.list.d/azure-cli.sources \
          /etc/apt/sources.list.d/google-chrome.sources \
          /etc/apt/sources.list.d/microsoft-prod.list \
          /etc/cloud \
          /etc/containers \
          /etc/default/grub.d \
          /etc/grub.d \
          /etc/mysql \
          /etc/needrestart \
          /etc/netplan \
          /etc/php \
          /etc/sgml \
          /etc/ssh \
          /etc/xml \
          /home/linuxbrew/ \
          /home/runner/.cache \
          /home/runner/.cargo \
          /home/runner/.rustup \
          /opt/az \
          /opt/google \
          /opt/hostedtoolcache \
          /opt/microsoft \
          /opt/pipx \
          /root/.* \
          /usr/lib/modprobe.d \
          /usr/lib/modules/* \
          /usr/lib/shim \
          /usr/lib/systemd/system-generators \
          /usr/lib/systemd/user \
          /usr/lib/systemd/user-generators \
          /usr/local/* \
          /usr/local/.* \
          /usr/share/apache-maven-* \
          /usr/share/az_* \
          /usr/share/dotnet \
          /usr/share/gradle-* \
          /usr/share/java \
          /usr/share/kotlinc \
          /usr/share/miniconda \
          /usr/share/php \
          /usr/share/swift \
          /var/lib/apt/* \
          /var/lib/command-not-found \
          /var/lib/docker \
          /var/lib/gems \
          /var/lib/libuuid \
          /var/lib/mysql \
          /var/lib/postgresql \
          /var/lib/ubuntu-release-upgrader \
          /var/lib/update-manager \
          /var/lib/update-notifier \
          /var/lib/waagent \
          /var/log/* \
          /var/www/html

        sudo userdel --remove packer

    - name: 'Create and mount Btrfs image'
      shell: bash
      run: |
        sudo apt update
        sudo apt install --yes btrfs-progs

        free_bytes=$(df --output=avail --block-size=1 / | tail --lines=1)
        image_size=$(( free_bytes - 1073741824 ))

        sudo truncate --size="${image_size}" /btrfs.img

        sudo mkfs.btrfs -m single /btrfs.img

        sudo mkdir --parents /mnt/btrfs
        sudo mount \
          --options=loop,noatime,compress-force=zstd:3 \
          /btrfs.img /mnt/btrfs

        sudo mkdir --parents /mnt/btrfs/usr/local /usr/local
        sudo chown --reference=/usr/local /mnt/btrfs/usr/local
        sudo chmod --reference=/usr/local /mnt/btrfs/usr/local
        sudo mount --bind /mnt/btrfs/usr/local /usr/local
        sudo mkdir --parents /usr/local/bin

        target_dest="${{ inputs.destination }}"
        if [[ -z "${target_dest}" ]]; then
          target_dest="${GITHUB_WORKSPACE}"
        fi

        if [[ -d "${target_dest}" ]]; then
          sudo rm --recursive --force "${target_dest:?}"/* 2>/dev/null || true
        else
          sudo mkdir --parents "${target_dest}"
        fi

        runner_user=$(id --user --name)
        runner_group=$(id --group --name)

        if [[ "${target_dest}" != "/mnt/btrfs" ]]; then
          sudo mkdir --parents /mnt/btrfs/workspace
          sudo chown --reference="${target_dest}" /mnt/btrfs/workspace
          sudo chmod --reference="${target_dest}" /mnt/btrfs/workspace
          sudo mount --bind /mnt/btrfs/workspace "${target_dest}"
          sudo chown --recursive \
            "${runner_user}:${runner_group}" "${target_dest}"
        fi
